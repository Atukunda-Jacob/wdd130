<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Water Rafting | Contact Us</title>
  <meta name="description" content="Contact White Water Rafting to book your next adventure. Find our location, phone number, and contact form.">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
  <!-- COMMON HEADER -->
  <header>
    <img src="images/logo.png" alt="White Water Rafting Logo">
    <nav>
      <a href="index.html">Home</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <p>Have questions? We'd love to hear from you.</p>

    <div class="contact-grid">
      <section>
        <h2>Send Us a Message</h2>
        <form>
          <label for="fullname">Name:</label>
          <input type="text" id="fullname" name="fullname" required>

          <label for="useremail">Email:</label>
          <input type="email" id="useremail" name="useremail" required>

          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <button type="submit">Send Message</button>
        </form>
      </section>

      <section>
        <h2>Visit Us</h2>
        <p>123 River Road, Rapids City, RC 12345</p>
        <p>Phone: 555-123-RAFT</p>
        <p>Email: info@wwrafting.com</p>
        <img src="images/map.jpg" alt="Map location" class="map">
      </section>
    </div>
  </main>

  <!-- COMMON FOOTER -->
  <footer>
    <p>&copy; 2025 White Water Rafting | Jacob Atukunda</p>
    <nav class="sociallinks">
      <a href="https://facebook.com"><img src="images/facebook.png" alt="Facebook"></a>
      <a href="https://instagram.com"><img src="images/instagram.png" alt="Instagram"></a>
      <a href="https://twitter.com"><img src="images/twitter.png" alt="Twitter"></a>
    </nav>
  </footer>
</body>
</html>
