<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting</title>
    <meta name="description" content="Contact White Water Rafting Company. Get in touch with questions about trips, reservations, or suggestions. Address: 123 Main River Street, Kolob, California">
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    
    <main>
        <h1>Contact White Water Rafting</h1>

        <!-- Company Information + Map -->
        <section class="contact-info">
            <div>
                <h2>Company Information</h2>
                <p><strong>Address:</strong> 123 Main River Street<br>
                Kolob, California<br>
                <strong>Phone:</strong> +1 999 999 9999<br>
                <strong>Email:</strong> info@whitewater.com</p>
            </div>
            <div class="map">
                <h2>Find Us</h2>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0!2d-114.1234!3d37.1234!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzfCsDA3JzI0LjQiTiAxMTTCsDA3JzI0LjQiVw!5e0!3m2!1sen!2sus!4v1234567890" 
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </section>

        <!-- Employee Profiles -->
        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Jane Doe smiling">
                <figcaption>Jane Doe - Trip Coordinator</figcaption>
            </figure>
            <figure>
                <img src="images/employee2.jpg" alt="John Smith with raft">
                <figcaption>John Smith - Lead Guide</figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Sarah Lee at office">
                <figcaption>Sarah Lee - Customer Service</figcaption>
            </figure>
        </section>

        <!-- Contact Form -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
                
                <fieldset>
                    <legend>Purpose of Message</legend>
                    <input type="radio" id="inquiry" name="purpose" value="General Inquiry" required>
                    <label for="inquiry">General Inquiry</label>
                    
                    <input type="radio" id="reservation" name="purpose" value="Reservation Question">
                    <label for="reservation">Reservation Question</label>
                    
                    <input type="radio" id="suggestion" name="purpose" value="Website Suggestion">
                    <label for="suggestion">Website Suggestion</label>
                </fieldset>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" placeholder="Type your message here" required></textarea>
                
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2024 White Water Rafting Company</p>
        <nav class="sociallinks">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>
            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a>
        </nav>
    </footer>
</body>
</html>
