<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Home</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
    <header>
        <img src="images/logo.png" alt="Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <!-- Hero -->
        <div class="hero">
            <img src="images/hero.jpg" alt="Rafting Adventure">
            <h1>Adventure Awaits You!</h1>
        </div>

        <!-- Newsletter -->
        <section class="newsletter">
            <h2>Join Our Newsletter</h2>
            <form>
                <label>Name: <input type="text" name="name" required></label>
                <label>Email: <input type="email" name="email" required></label>
                <button type="submit">Subscribe</button>
            </form>
        </section>

        <!-- CTA -->
        <section class="cta">
            <h2>Ready for the Adventure?</h2>
            <a href="trips.html" class="button">Explore Our Trips</a>
        </section>

        <!-- Grid -->
        <section class="grid">
            <div>
                <img src="images/rafting1.jpg" alt="Family Rafting">
                <h3>Family Fun</h3>
                <p>Safe and exciting trips for the whole family.</p>
            </div>
            <div>
                <img src="images/rafting2.jpg" alt="River View">
                <h3>Breathtaking Views</h3>
                <p>Experience nature like never before on the river.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Atukunda Jacob</p>
    </footer>
</body>
</html>
